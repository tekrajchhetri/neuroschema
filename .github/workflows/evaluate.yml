name: Evaluate catalog

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday 04:17 UTC
  push:
    branches: [main]
    # Re-evaluate when the catalog or the evaluation code changes.
    paths: [data/catalog.json, scripts/rubric.mjs, scripts/evaluate.mjs, scripts/quality.mjs, scripts/pitfalls.py, docker/oops/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: false

env:
  NEUROSCHEMA_CI: "1" # this workflow is the only writer of data/evaluation.json, data/runs/ and data/quality/

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      # OOPS! runs locally from source (docker/oops) so pitfall scans don't depend on the public server.
      - uses: docker/setup-buildx-action@v3
      - name: Build OOPS! image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker/oops
          tags: neuroschema/oops:latest
          load: true
          cache-from: type=gha,scope=oops
          cache-to: type=gha,mode=max,scope=oops
      - name: Ontology quality checks (ROBOT reasoner/report, OOPS! pitfalls, Python fallback)
        timeout-minutes: 240
        env:
          ROBOT_VERSION: v1.9.7
          OOPS_IMAGE: neuroschema/oops:latest
        run: |
          curl -sSL -o robot.jar "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          ROBOT_JAR="$PWD/robot.jar" node scripts/quality.mjs
      - name: Run automated evaluation
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
        run: node scripts/evaluate.mjs
      - run: node scripts/build.mjs
      - name: Commit results and the archived run
        run: |
          git add data/evaluation.json data/runs data/quality
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "neuroschema-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Evaluation run $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved while we evaluated. Rebase onto it; for the generated files
          # (evaluation.json, quality/) this run's fresh results win. Retry a few times.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
